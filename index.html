<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia de Livros — Análise por IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="hero">
    <div class="hero-topbar">
      <div class="hero-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="2.6"/>
          <path d="M6.5 21v-3.2c0-1.8 1.5-3.3 3.3-3.3h4.4c1.8 0 3.3 1.5 3.3 3.3V21"/>
          <circle cx="5" cy="11" r="1.9"/>
          <path d="M1.5 20v-2c0-1.4 1.1-2.5 2.5-2.5h.6"/>
          <circle cx="19" cy="11" r="1.9"/>
          <path d="M22.5 20v-2c0-1.4-1.1-2.5-2.5-2.5h-.6"/>
        </svg>
      </div>
    </div>

    <div class="hero-content">
      <div class="badge-top">✨ leitura em família ✨</div>
      <h1 class="title">Guia de Livros</h1>
      <p class="subtitle">Análise inteligente de livros infantis para família.</p>
    </div>
  </header>

  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z" fill="#E6E8F2"/>
    </svg>
  </div>

  <main class="app-main">

    <nav class="tabs">
      <button class="tab active" data-tab="pesquisar">🔎 Pesquisar</button>
      <button class="tab" data-tab="historico">📚 Histórico</button>
      <button class="tab" data-tab="ranking">🏆 Ranking</button>
    </nav>

    <section id="tab-pesquisar" class="tab-panel active">
      <div class="search-box">
        <h2>Qual livro você quer avaliar?</h2>

        <div class="search-field">
          <span class="search-icon">📖</span>
          <input id="input-titulo" type="text" placeholder="Nome do livro...">
        </div>

        <div class="search-field">
          <span class="search-icon">✍️</span>
          <input id="input-autor" type="text" placeholder="Autor (opcional)">
        </div>

        <button id="btn-analisar" class="btn-primary">🔎 ANALISAR</button>
        <p id="search-status" class="status"></p>
      </div>

      <div id="resultado" class="resultado hidden"></div>
    </section>

    <section id="tab-historico" class="tab-panel">
      <div class="panel-header">
        <h2>📚 Histórico de consultas</h2>
        <button id="btn-limpar-historico" class="btn-ghost">🗑️ Apagar</button>
      </div>
      <div id="lista-historico"></div>
    </section>

    <section id="tab-ranking" class="tab-panel">
      <div class="panel-header">
        <h2>🏆 Ranking personalizado</h2>
      </div>

      <div class="ranking-controls">
        <label>
          Para qual idade?
          <input id="input-idade" type="number" min="3" max="16" value="9">
          anos
        </label>

        <label>
          Ordenar por
          <select id="select-ordem">
            <option value="recomendacao">🏆 Recomendação</option>
            <option value="qualidade">⭐ Qualidade</option>
            <option value="valores">🧭 Valores</option>
            <option value="sensivel">🟢 Menos sensível</option>
            <option value="cristao">✝️ Cristão</option>
          </select>
        </label>

        <label class="check">
          <input id="filtro-sem-alertas" type="checkbox">
          Só sem alertas
        </label>
      </div>

      <div id="lista-ranking"></div>
    </section>

  </main>

  <footer>
    <p class="credit">Feito com carinho para ajudar famílias a escolherem boas histórias 💙</p>
    <p class="copyright">
      © <span id="copy-year"></span> Ihcsolutions
      <span class="dot">·</span>
      v<span id="app-version">3.0</span>
    </p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
