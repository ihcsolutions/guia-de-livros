<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Worker v2 — Guia de Livros</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a2039;
    color: #eef1ff;
    padding: 16px;
    line-height: 1.5;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; opacity: 0.6; margin-bottom: 20px; }
  .box {
    background: #222b3e;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    opacity: 0.8;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #3a4460;
    background: #141a29;
    color: #eef1ff;
    font-size: 15px;
    margin-bottom: 14px;
    -webkit-appearance: none;
    font-family: inherit;
  }
  input:last-of-type { margin-bottom: 0; }
  button {
    width: 100%;
    padding: 16px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, #9b7bff, #4dc8ff);
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    margin-bottom: 10px;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.4; }
  .status {
    font-size: 14px;
    padding: 14px;
    border-radius: 10px;
    background: #141a29;
    margin-bottom: 12px;
    display: none;
    word-break: break-word;
  }
  .status.show { display: block; }
  .status.ok { color: #8de8df; }
  .status.err { color: #ff9b9b; }
  .status.loading { color: #ffe08a; }
  pre {
    background: #0d1220;
    color: #d8e7ff;
    padding: 14px;
    border-radius: 10px;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: "SF Mono", Menlo, monospace;
    display: none;
  }
  pre.show { display: block; }
  .warning {
    background: #3a1a1a;
    border: 1px solid #6a2a2a;
    color: #ffb0b0;
    padding: 12px;
    border-radius: 10px;
    font-size: 12.5px;
    margin-bottom: 14px;
    line-height: 1.55;
  }
  .passo {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<h1>🚀 Deploy Worker v2</h1>
<p class="sub">Diagnóstico passo a passo</p>

<div class="warning">
  <strong>⚠️</strong> O token não sai do seu iPhone. Revogue depois no painel.
</div>

<div class="box">
  <label>API Token da Cloudflare</label>
  <input id="token" type="password" placeholder="Cole o token aqui" autocomplete="off">

  <label>Account ID</label>
  <input id="accountId" type="text" placeholder="32 caracteres" autocomplete="off">

  <label>Nome do Worker</label>
  <input id="scriptName" type="text" value="guia-de-livros-brain" autocomplete="off">
</div>

<button id="btn-diag" onclick="diagnostico()">🔍 Só verificar (sem alterar)</button>
<button id="btn" onclick="deploy()">🚀 Deploy</button>

<div id="status" class="status"></div>
<pre id="log"></pre>

<script>
const WORKER_FILE = "worker.js";

function setStatus(tipo, texto) {
  const s = document.getElementById("status");
  s.className = "status show " + tipo;
  s.textContent = texto;
}
function log(msg) {
  const l = document.getElementById("log");
  l.textContent += msg + "\n";
  l.className = "show";
}
function limpar() {
  document.getElementById("log").textContent = "";
}

async function diagnostico() {
  limpar();
  const token = document.getElementById("token").value.trim();
  const accountId = document.getElementById("accountId").value.trim();

  setStatus("loading", "🔍 Rodando diagnóstico...");

  // 1. Testa baixar worker.js
  log("=== 1. Baixar worker.js do GitHub ===");
  try {
    const url = WORKER_FILE + "?t=" + Date.now();
    log("URL: " + url);
    const r = await fetch(url);
    log("Status HTTP: " + r.status);
    if (!r.ok) {
      setStatus("err", "❌ worker.js não encontrado no GitHub (HTTP " + r.status + "). Suba o arquivo primeiro.");
      return;
    }
    const code = await r.text();
    log("Tamanho: " + code.length + " bytes");
    log("Primeiras linhas: " + code.slice(0, 100).replace(/\n/g, " "));
    log("✅ worker.js OK");
  } catch (e) {
    log("❌ Erro: " + e.message);
    setStatus("err", "❌ Falhou baixar worker.js: " + e.message);
    return;
  }

  // 2. Testa token na API Cloudflare
  log("\n=== 2. Testar token na API ===");
  if (!token) {
    log("⚠️ Token não preenchido");
    setStatus("err", "⚠️ Preencha o token primeiro");
    return;
  }
  if (!accountId) {
    log("⚠️ Account ID não preenchido");
    setStatus("err", "⚠️ Preencha o Account ID primeiro");
    return;
  }
  log("Token: " + token.length + " caracteres (mostrando só os últimos 4: ..." + token.slice(-4) + ")");
  log("Account ID: " + accountId.length + " caracteres");

  try {
    const r = await fetch(
      "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/scripts",
      {
        method: "GET",
        headers: { "Authorization": "Bearer " + token }
      }
    );
    log("Status HTTP: " + r.status);
    const data = await r.json();
    log("Resposta: " + JSON.stringify(data).slice(0, 300));

    if (data.success) {
      log("✅ Token OK — " + (data.result?.length || 0) + " workers encontrados");
      const nomes = (data.result || []).map(w => w.id).join(", ");
      log("Workers na conta: " + nomes);
      setStatus("ok", "✅ Tudo OK. Pode clicar em Deploy.");
    } else {
      const err = data.errors?.[0]?.message || "erro desconhecido";
      log("❌ Erro: " + err);
      setStatus("err", "❌ Token inválido: " + err);
    }
  } catch (e) {
    log("❌ Exceção: " + e.name + " — " + e.message);
    setStatus("err", "❌ Falha de rede ao chamar Cloudflare: " + e.message);
  }
}

async function deploy() {
  const btn = document.getElementById("btn");
  const token = document.getElementById("token").value.trim();
  const accountId = document.getElementById("accountId").value.trim();
  const scriptName = document.getElementById("scriptName").value.trim();

  limpar();
  btn.disabled = true;

  try {
    setStatus("loading", "⏳ Baixando worker.js...");
    log("=== Baixando worker.js ===");
    const r = await fetch(WORKER_FILE + "?t=" + Date.now());
    if (!r.ok) throw new Error("worker.js HTTP " + r.status);
    const code = await r.text();
    log("OK — " + code.length + " bytes");

    setStatus("loading", "⏳ Enviando pra Cloudflare...");
    log("\n=== PUT na API Cloudflare ===");
    log("URL: /accounts/" + accountId + "/workers/scripts/" + scriptName + "/content");

    const resp = await fetch(
      "https://api.cloudflare.com/client/v4/accounts/" + accountId +
      "/workers/scripts/" + scriptName + "/content",
      {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/javascript"
        },
        body: code
      }
    );

    log("Status HTTP: " + resp.status);
    const data = await resp.json();
    log("Resposta: " + JSON.stringify(data, null, 2).slice(0, 500));

    if (data.success) {
      setStatus("ok", "✅ Deploy feito! Worker v5.4.1 no ar.");
    } else {
      const msg = data.errors?.[0]?.message || "erro desconhecido";
      setStatus("err", "❌ " + msg);
    }
  } catch (e) {
    setStatus("err", "❌ " + e.name + ": " + e.message);
    log("\n❌ Exceção completa: " + e.name + " — " + e.message);
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
